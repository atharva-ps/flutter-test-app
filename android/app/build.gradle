plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.justbaat.ads.flutter_test_app"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.justbaat.ads.flutter_test_app"
        minSdkVersion 24   // required by the Next-Gen SDK
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// Next-Gen (ads-mobile-sdk) bundles the com.google.android.gms.ads.* classes itself.
// Mediation adapters pull the classic play-services-ads transitively — exclude it
// everywhere to avoid duplicate-class build errors.
configurations.all {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.2.1")
    implementation("com.unity3d.ads-mediation:mediation-sdk:8.10.0")
    implementation "com.google.code.gson:gson:2.10.1"
    implementation("com.justbaatAds:adsSdk:1.1.1")
    implementation("com.google.android.gms:play-services-appset:16.0.0")
    implementation("com.google.android.gms:play-services-ads-identifier:18.1.0")
    implementation("com.google.android.gms:play-services-basement:18.1.0")
    implementation("com.google.ads.mediation:ironsource:8.10.0.0")
    implementation("com.google.ads.mediation:inmobi:10.8.0.0")
    implementation("com.unity3d.ads:unity-ads:4.15.1")
    implementation("com.google.ads.mediation:unity:4.15.1.0")
    implementation("com.google.ads.mediation:pangle:7.3.0.4.0")
    implementation("com.google.ads.mediation:vungle:7.5.0.1")
}
